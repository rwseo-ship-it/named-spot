<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBFCF6">
<meta name="color-scheme" content="light">
<title>NAMED FESTA 현장 현황판</title>
<style>
:root{--bg:#FBFCF6;--fg:#111;--sub:#45453F;--mute:#6A6A64;--hair:#D6D7CC;--paper:#fff;--soft:#EFEFE8;
--y:#FDD921;--yl:#FFF3B0;--g:#A0D94E;--gl:#E2F3CC;--p:#F088C2;--pl:#FCDDEE;--b:#69CDF4;--bl:#D6F0FC;
--red:#B3121B;--redl:#FBE3E4;
--f:"Pretendard","Apple SD Gothic Neo","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
--hh:52px;--tab:60px;--gut:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5;font-weight:450;letter-spacing:-.2px;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;overflow-x:hidden;
padding:0 env(safe-area-inset-right) calc(var(--tab) + env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;letter-spacing:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h2{font-size:20px;font-weight:800;line-height:1.3}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;height:calc(var(--hh) + env(safe-area-inset-top));background:var(--bg);border-bottom:2px solid var(--fg);padding:env(safe-area-inset-top) var(--gut) 0;display:flex;align-items:center;gap:8px}
.top .brand{font-size:16px;font-weight:800;flex:1;min-width:0;white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border:2px solid var(--fg);border-radius:3px;background:var(--paper);font-weight:800;font-size:16px;cursor:pointer}
.tbtn .pl{font-size:13px;font-weight:800;background:var(--y);padding:2px 6px;border-radius:2px}
.tbtn.live .pl{background:var(--fg);color:var(--bg)}

.pane{padding:0 var(--gut)}
.head{padding:12px 0 10px}

/* segmented control */
.segmark{height:0}
.seg{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top));z-index:15;background:var(--bg);margin:0 calc(-1*var(--gut));padding:8px var(--gut);border-bottom:1px solid var(--hair)}
.seg .in{display:flex;border:2px solid var(--fg);border-radius:4px;background:var(--paper);overflow:hidden}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:0;border-left:2px solid var(--fg);background:none;font-size:15px;font-weight:700;cursor:pointer;padding:0 4px;line-height:1.2;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-selected=true]{background:var(--fg);color:var(--bg);font-weight:800}
.seg button .n{font-weight:600;opacity:.75}
.body{padding-top:14px}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border:2px solid var(--fg);background:var(--paper);border-radius:3px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;text-align:center}
.btn.sm{min-height:44px;font-size:15px;padding:0 12px}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.full{display:flex;width:100%}
.btn:active{background:var(--fg);color:var(--bg)}
.btn.dark:active{background:var(--sub)}
.lnk{background:none;border:0;padding:0 2px;min-height:44px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:16px}
.tag{display:inline-block;font-size:13px;font-weight:800;line-height:1;padding:4px 6px 3px;border-radius:2px;background:var(--c);color:#111;white-space:nowrap;vertical-align:1px}
.mute{color:var(--sub)}
.small{font-size:14px;color:var(--sub);font-weight:600}
.h3{font-size:15px;font-weight:800;margin:18px 0 6px;color:var(--sub)}
.h3:first-child{margin-top:0}
.empty{font-size:16px;color:var(--sub);padding:10px 0}
.empty b{color:var(--fg)}
.over{color:var(--red);font-weight:800}
.st{display:inline-block;font-size:13px;font-weight:800;padding:4px 7px 3px;border-radius:2px;border:1.5px solid var(--fg);line-height:1;white-space:nowrap}
.st.go{background:var(--fg);color:var(--bg)}
.st.gat{border-width:2px;background:var(--paper)}
.st.soon{border-color:var(--sub);color:var(--fg);font-weight:700}
.st.pre{border-color:var(--hair);color:var(--sub);font-weight:700}
.st.done{border-color:var(--hair);color:var(--mute);font-weight:600}

/* details / accordion */
details{border-top:1px solid var(--hair)}
details>summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:6px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;font-size:24px;font-weight:500;line-height:1;width:24px;text-align:center;flex:0 0 24px}
details[open]>summary::after{content:"\2212"}
details>summary .sm{font-weight:600;font-size:14px;color:var(--sub)}
details .dbody{padding:0 0 14px}
.acc>details:last-child{border-bottom:1px solid var(--hair)}
ul.dots{margin:0;padding:0 0 0 18px}
ul.dots li{margin:4px 0}
ol.steps{margin:0;padding:0;list-style:none}
ol.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;padding:9px 0;border-top:1px solid var(--hair)}
ol.steps li:first-child{border-top:0}
ol.steps .k{font-size:18px;font-weight:800;line-height:1.35}
ol.steps b{display:block;font-weight:800;font-size:17px}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px 12px;margin:0;font-size:16px}
.kv dt{font-weight:600;color:var(--sub)}
.kv dd{margin:0;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 8px 8px 0;border-top:1px solid var(--hair)}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.tbl th{font-weight:800;white-space:nowrap}

/* NOW: clock */
.clock{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;text-align:left;background:none;border:0;padding:0;cursor:pointer;font-size:16px;font-weight:600;color:var(--sub)}
.clock em{font-style:normal;margin-left:auto;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.prev{background:var(--soft);padding:8px 12px;margin-top:4px;font-size:15px;font-weight:600;border-radius:2px}
.ask{border:2px solid var(--fg);border-radius:3px;background:var(--paper);padding:14px 14px 6px;margin-top:4px}
.ask h2{font-size:24px}
.ask p{font-size:16px;color:var(--sub);margin:4px 0 12px}
.ask .lnk{display:block;width:100%;text-align:center;color:var(--sub);font-weight:600}
.mine{display:flex;width:100%;text-align:left;margin-top:4px;border:2px solid var(--fg);border-radius:3px;background:var(--paper);padding:0;cursor:pointer}
.mine .bar{width:10px;flex:0 0 10px;background:var(--c)}
.mine .in{padding:10px 12px;flex:1;min-width:0}
.mine .k{display:block;font-size:14px;font-weight:600;color:var(--sub)}
.mine .w{display:block;font-size:21px;font-weight:800;line-height:1.3;margin-top:2px}
.mine .w i{font-style:normal;font-size:16px;font-weight:600}
.mine .nx{display:block;font-size:16px;font-weight:500;margin-top:4px}
.mine .nx i{font-style:normal;color:var(--sub);font-size:14px;font-weight:600;margin-right:4px}
.mine .wt{display:block;font-size:14px;font-weight:500;color:var(--sub);margin-top:4px}
.mine.ask2{display:flex;align-items:center;min-height:48px;padding:6px 14px;border-style:dashed;border-width:1.5px;font-weight:600;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:72px;padding:6px 10px;border:2px solid var(--fg);border-radius:3px;background:var(--paper);cursor:pointer;min-width:0}
.tile .l{font-size:13px;font-weight:600;color:var(--sub);line-height:1.25}
.tile .v{font-size:22px;font-weight:800;line-height:1.15;margin-top:2px;letter-spacing:-.5px}
.tile .v.sm2{font-size:18px}
.tile .s{font-size:13px;font-weight:500;color:var(--sub);line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.tile:active{background:var(--soft)}

/* NOW: board */
.ends{font-size:13px;font-weight:600;color:var(--sub);padding:0 0 4px}
.ends.s{padding:6px 0 0}
.zone{border-left:8px solid var(--c);background:var(--cl);padding:5px 8px 6px;margin-top:4px;border-radius:2px}
.zone:first-child{margin-top:0}
.zh{display:flex;align-items:baseline;gap:6px;font-size:14px;font-weight:600;color:var(--sub);margin-bottom:4px;line-height:1.25;flex-wrap:wrap}
.zh b{font-size:15px;font-weight:800;color:var(--fg)}
.zh .n{margin-left:auto;font-size:13px;font-weight:600}
.zone.off{background:none;padding:4px 10px;border-left-width:4px}
.zone.off .zh{margin:0;color:var(--mute)}
.zone.off .zh b{color:var(--mute);font-size:14px}
.zsub{border-top:1px solid color-mix(in srgb,var(--c) 80%,#fff);padding-top:4px;margin-top:5px}
.zh+.zsub{border-top:0;padding-top:0;margin-top:0}
.zsub.off{padding-top:4px;color:var(--mute);font-size:14px;font-weight:600}
.zsub .sl{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pair .zone{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.cg{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px}
.cg .g{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px;max-width:100%}
.cg .gl{font-size:13px;font-weight:500;color:var(--sub);line-height:1.2;max-width:9em}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:44px;min-width:44px;justify-content:center;padding:2px 9px;background:var(--paper);border:1.5px solid var(--fg);border-radius:3px;cursor:pointer;text-align:left;max-width:100%;line-height:1.2;font-size:15px;font-weight:700}
.chip span{font-size:13px;font-weight:500;color:var(--sub)}
.chip:active{background:var(--fg);color:var(--bg)}
.chip:active span{color:var(--bg)}
.zemp{font-size:13px;font-weight:500;color:var(--sub);margin-top:5px;padding-top:4px;border-top:1px solid color-mix(in srgb,var(--c) 80%,#fff)}
.shops{margin-top:8px}
.shop{border:0;border-left:8px solid var(--p);background:var(--pl);border-radius:2px;margin-top:6px}
.shop>summary{padding:2px 10px;min-height:48px;font-size:15px}
.shop .sh2{font-size:13px;font-weight:600;color:var(--sub);padding:8px 0 2px}
.shop>summary .r{margin-left:auto;font-size:14px;font-weight:700;white-space:nowrap}
.shop>summary .r i{font-style:normal;color:var(--sub);font-weight:600}
.shop .dbody{padding:0 10px 10px}
.sline{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid color-mix(in srgb,var(--p) 60%,#fff);font-size:15px}
.sline b{font-weight:800}
.sline .h{margin-left:auto;font-size:14px;font-weight:600;white-space:nowrap}
.sline.off{color:var(--mute)}
.band{margin-top:10px;padding-top:6px;border-top:2px solid var(--fg)}
.offline{font-size:13px;color:var(--sub);font-weight:500;padding:6px 0 0}

/* rows */
.rows{list-style:none;margin:0;padding:0}
.rows>li{border-top:1px solid var(--hair)}
.rows>li:first-child{border-top:0}
.row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:10px 0;width:100%;text-align:left;background:none;border:0;cursor:pointer}
div.row{cursor:default}
.row .tm{font-size:18px;font-weight:600;line-height:1.2}
.row .tm small{display:block;font-size:13px;font-weight:600;color:var(--sub)}
.row .ds{font-size:16px;line-height:1.4;min-width:0}
.row .ds b{font-weight:800}
.row .mt{font-size:14px;color:var(--sub);margin-top:2px}

/* ME */
.viewing{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bl);padding:10px 12px;margin-top:12px;border-radius:2px;font-weight:600}
.viewing span{flex:1 1 100%}
.who{display:flex;align-items:center;gap:10px}
.who .nm{flex:1;min-width:0}
.who h1{font-size:26px;font-weight:800;line-height:1.2}
.who p{font-size:15px;color:var(--sub);margin-top:2px}
.card{display:flex;border:2px solid var(--fg);border-radius:3px;background:var(--cl)}
.card+.card{margin-top:8px}
.card .bar{width:10px;flex:0 0 10px;background:var(--c)}
.card .in{padding:12px 14px 14px;flex:1;min-width:0}
.card .k{font-size:14px;font-weight:600;color:var(--sub)}
.card .k span{font-weight:600;color:var(--sub)}
.card .w{font-size:21px;font-weight:800;line-height:1.3;margin:4px 0 6px}
.card .pl{font-size:16px;font-weight:500}
.card .nt{font-size:15px;color:var(--sub);margin-top:6px}
.card.nx{background:var(--paper)}
.card.nx .w{font-size:18px}
.calls{display:grid;gap:8px;margin-top:14px}
.callb{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 14px;border:2px solid var(--fg);border-radius:3px;background:var(--fg);color:var(--bg);text-decoration:none}
.callb b{font-size:17px;font-weight:800}
.callb span{font-size:14px;opacity:.8;flex:1;min-width:0}
.callb em{font-style:normal;font-weight:800;font-size:15px;white-space:nowrap}
.callb.lt{background:var(--paper);color:var(--fg)}
.callb:active{opacity:.8}
.info{margin-top:16px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.tl li:first-child{border-top:0}
.tl .tm{font-size:18px;font-weight:800;line-height:1.2}
.tl .tm small{display:block;font-size:14px;font-weight:600;color:var(--sub)}
.tl .ds{border-left:6px solid var(--c);padding-left:10px;min-width:0}
.tl .ds .w{font-size:16px;font-weight:600;line-height:1.45;margin-top:4px}
.tl .ds .nt{font-size:14px;color:var(--sub);margin-top:4px}
.tl li.on .ds{background:var(--cl);padding:6px 10px 8px}
.tl li.ov .ds{border-left-color:var(--red)}
.tl.past li{opacity:.55}
.ovm{display:block;margin-top:6px;font-size:14px;font-weight:800;color:var(--red)}
.ovm.team{color:var(--sub);font-weight:700}
.tl li.nowl{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:0;font-size:14px;font-weight:800;scroll-margin-top:130px}
.tl li.nowl::after{content:"";flex:1;height:3px;background:var(--fg)}
.tl li.nowl+li{border-top:0}
.pastd{border-top:0;border-bottom:1px solid var(--hair);margin-bottom:4px}
.pastd>summary{font-size:16px;color:var(--sub)}
.rgrp{padding:12px 0;border-top:1px solid var(--hair)}
.rgrp:first-of-type{border-top:0}
.rgrp h2{font-size:17px;margin-bottom:6px}
.rgrp h2 span{font-size:14px;color:var(--sub);font-weight:600}
.roleline{font-size:17px;font-weight:600;line-height:1.5;padding-bottom:12px;border-bottom:2px solid var(--fg)}
.picker .grp{padding:10px 0 12px;border-top:1px solid var(--hair)}
.picker .grp:first-of-type{border-top:0}
.picker h2{font-size:15px;color:var(--sub);margin-bottom:8px}
.gbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gbtns button{min-height:56px;border:2px solid var(--fg);background:var(--paper);border-radius:3px;font-weight:800;font-size:16px;cursor:pointer;padding:6px 4px;line-height:1.2;min-width:0}
.gbtns button small{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-top:2px}
.gbtns button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.gbtns button[aria-pressed=true] small{color:var(--bg)}

/* WALK */
.wcard{display:block;width:100%;text-align:left;border:2px solid var(--fg);border-radius:3px;background:var(--paper);padding:12px 14px;cursor:pointer;margin-top:8px}
.wcard.go{background:var(--bl)}
.wcard .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wcard .no{font-size:24px;font-weight:800;line-height:1}
.wcard .lf{margin-left:auto;font-size:15px;font-weight:600;color:var(--sub)}
.wcard .nm{display:block;font-size:16px;font-weight:500;line-height:1.4;margin-top:6px}
.wcard .mt{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;font-weight:500;color:var(--sub);margin-top:6px}
.wcard.done{border-color:var(--hair)}
.wcard.done .no{color:var(--sub)}
.wcard .mt span{white-space:nowrap}
.wcard:active{background:var(--soft)}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{border-top:1px solid var(--hair)}
.wlist li:first-child{border-top:0}
.wrow{display:grid;grid-template-columns:44px 52px 44px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-height:56px;padding:6px 0;background:none;border:0;text-align:left;cursor:pointer}
.wrow .no{font-size:18px;font-weight:800}
.wrow .tm{font-size:16px;font-weight:500}
.wh{font-size:14px;font-weight:600;color:var(--sub);padding:12px 0 2px;border-bottom:1px solid var(--hair)}
.wh:first-child{padding-top:4px}
.wrow .tag{justify-self:start}
.wrow .cnt{font-size:16px;font-weight:700;text-align:right;white-space:nowrap}
.wrow.done{color:var(--mute)}
.wrow.done .no{font-weight:600}
.wrow:active{background:var(--soft)}
.gantt{position:relative;margin:4px 0 4px;padding-bottom:20px}
.gantt .axis{position:relative;height:18px;margin-left:36px;font-size:12px;color:var(--sub);font-weight:700}
.gantt .axis span{position:absolute;transform:translateX(-50%)}
.gantt .axis span:first-child{transform:none}
.gantt .axis span:last-child{transform:translateX(-100%)}
.grow{display:flex;align-items:center;height:15px}
.grow .gl{width:36px;flex:0 0 36px;font-size:11px;font-weight:800}
.grow .gl.over{color:var(--red)}
.grow .gt{position:relative;flex:1;height:100%;border-left:1px solid var(--hair)}
.grow .bar{position:absolute;top:2px;height:11px;display:flex;border:1px solid #111;border-radius:1px;overflow:hidden}
.grow .bar i{display:block;height:100%}
.grow.done .bar{opacity:.3}
.gnow{position:absolute;top:18px;bottom:18px;width:2px;background:#111;margin-left:-1px}
.gnow b{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;background:var(--bg);padding:0 3px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--sub);font-weight:600}
.legend i{display:inline-block;width:14px;height:10px;border:1px solid #111;vertical-align:-1px;margin-right:4px}
.rbtn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 16px;background:#111;color:#fff;font-weight:800;font-size:17px;text-decoration:none;border-radius:3px}

.memo{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--hair)}
.memo li{position:relative;padding:8px 0 8px 18px;border-bottom:1px solid var(--hair);font-size:16px;line-height:1.45}
.memo li::before{content:"";position:absolute;left:3px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--mute)}
.memo li.cau::before{left:2px;top:15px;width:9px;height:9px;border-radius:1px;background:var(--red)}
.memo li.cau{font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mh{font-size:14px;font-weight:600;color:var(--sub);margin-top:16px}
/* SOS */
.sos{background:var(--red);color:#fff;margin:0 calc(-1*var(--gut));padding:12px var(--gut) 14px}
.sos h2{font-size:19px}
.sos h2 span{font-size:14px;font-weight:600;opacity:.9;margin-left:6px}
.addrs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}

  b+='<p style="margin-top:12px"><button class="btn dark full" data-close="1">이 시각으로 보기</button></p>';
  return {t:'보는 시각',b:b,time:true};
}
function tsLabel(){var v=$('tsv');if(v)v.textContent=hm(T);var mm=$('tsm');if(mm)mm.textContent=countdown(T);document.querySelectorAll('[data-tq]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.tq===hm(T)?'true':'false')})}

/* ---------- sheet ---------- */
var sheetFn=null,lastFocus=null,shTimer;
function drawSheet(){if(!sheetFn)return;var r=sheetFn();$('shT').textContent=r.t;keep($('shB'),r.b);if(r.time)tsLabel()}
var shPushed=false,afterPop=null;
function openSheet(fn){
  clearTimeout(shTimer);if(!sheetFn)lastFocus=document.activeElement;var was=!!sheetFn;sheetFn=fn;drawSheet();$('shB').scrollTop=0;
  if(!was&&!shPushed){try{history.pushState({nfSheet:1},'',location.href);shPushed=true}catch(e){}}
  $('sheet').hidden=false;$('scrim').hidden=false;document.body.classList.add('lock');void $('sheet').offsetHeight;document.body.classList.add('sheet-on');
  setTimeout(function(){try{$('shX').focus({preventScroll:true})}catch(e){}},30);
  if(fn===timeSheet)bindSlider();
}
function closeSheet(then){
  if(!sheetFn){if(then)then();return}
  if(shPushed){shPushed=false;afterPop=then||null;try{history.back();return}catch(e){}}
  hideSheet();if(then)then()}
window.addEventListener('popstate',function(){if(shPushed||sheetFn){shPushed=false;hideSheet();var f=afterPop;afterPop=null;if(f)f()}});
function hideSheet(){if(!sheetFn)return;sheetFn=null;document.body.classList.remove('sheet-on','lock');shTimer=setTimeout(function(){$('sheet').hidden=true;$('scrim').hidden=true},230);if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true})}catch(e){}}
function bindSlider(){var sl=$('sl');if(!sl)return;sl.addEventListener('input',function(){mode=isDay?'manual':'fixed';T=+sl.value;tsLabel();renderLight()})}
$('shX').onclick=function(){closeSheet()};$('scrim').onclick=function(){closeSheet()};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetFn)closeSheet()});

/* ---------- router ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-kf]');if(!b)return;e.stopPropagation();KF=b.getAttribute('data-kf');renderLight()},true);
var R={now:renderNow,me:renderMe,walk:renderWalk,sos:renderSos,map:renderMap};
function render(){
  renderTop();
  var el=$('v-'+view),r=R[view]();
  keep(el,r.head+(r.noseg?'':segbar(view)+'<div class="body">'+r.body+'</div>'));
  if(sheetFn&&sheetFn!==timeSheet)drawSheet();
}
var rl;function renderLight(){cancelAnimationFrame(rl);rl=requestAnimationFrame(function(){var y=window.scrollY;render();window.scrollTo(0,y)})}
function afterNav(){if(view==='me'&&SEG.me==='all'){var n=$('nowl');if(n){var y=n.getBoundingClientRect().top+window.scrollY-150;if(y>0)window.scrollTo(0,y)}}}
function setSeg(k){
  SEG[view]=k;saveSeg();
  var y=window.scrollY;render();
  var mk2=$('v-'+view).querySelector('.segmark');
  if(mk2){var target=mk2.getBoundingClientRect().top+window.scrollY-document.querySelector('.top').offsetHeight;window.scrollTo(0,Math.min(y,Math.max(0,target)))}
  afterNav();
}
function show(v,noHash){
  if(sheetFn&&shPushed){closeSheet(function(){show(v,noHash)});return}
  hideSheet();view=v;
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v?'true':'false')});
  Object.keys(R).forEach(function(k){$('v-'+k).hidden=k!==v});
  render();window.scrollTo(0,0);afterNav();
  if(!noHash){var hs=v==='now'?'':v==='me'&&meView&&meView!==getMe()?'#p='+meView:'#'+v;try{history.replaceState(null,'',location.pathname+location.search+hs)}catch(e){}}
}
function fromHash(){
  var h=location.hash.replace('#','');
  var pm=/^p=([A-Za-z0-9]+)/.exec(h);
  if(pm&&BY[pm[1]]){meView=pm[1];show('me',true);return}
  if(R[h])show(h,true);else show('now',true);
}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(!b)return;if(b.dataset.v==='me'&&view!=='me')meView='';show(b.dataset.v)});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-seg],[data-seg2],[data-p],[data-pp],[data-pick],[data-pickopen],[data-setme],[data-back],[data-copy],[data-w],[data-go],[data-gome],[data-jump],[data-time],[data-tq],[data-golive],[data-close],[data-skip]');if(!b)return;
  var d=b.dataset;
  if(d.seg){if(SEG[view]!==d.seg)setSeg(d.seg)}
  else if(d.seg2){setSeg(d.seg2)}
  else if(d.pp){openSheet(function(){return personSheet(d.pp)})}
  else if(d.p){meView=d.p===getMe()?'':d.p;SEG.me=d.all?'all':'now';saveSeg();show('me')}
  else if(d.pickopen){var kind=d.pickopen;openSheet(function(){return {t:kind==='other'?'누구 일정을 볼까요?':'내 이름 고르기',b:pickerHtml(kind)}})}
  else if(d.pick){if(d.kind==='home'){setMe(d.pick);meView='';show('now');return}if(d.kind==='other'){meView=d.pick===getMe()?'':d.pick}else{setMe(d.pick);meView=''}SEG.me='now';saveSeg();show('me')}
  else if(d.skip){lsSet('nf_skip','1');render()}
  else if(d.setme){setMe(d.setme);meView='';show('me')}
  else if(d.back){meView='';show('me')}
  else if(d.copy){copy(d.copy)}
  else if(d.w){var no=d.w;openSheet(function(){return walkSheet(no)})}
  else if(d.go){show(d.go)}
  else if(d.gome){meView='';SEG.me='now';saveSeg();show('me')}
  else if(d.jump){setSeg(d.jump)}
  else if(d.time){openSheet(timeSheet)}
  else if(d.tq){mode=isDay?'manual':'fixed';T=m(d.tq);var sl=$('sl');if(sl)sl.value=T;tsLabel();renderLight()}
  else if(d.golive){mode='live';T=kmin();var sl2=$('sl');if(sl2)sl2.value=Math.round(T/10)*10;tsLabel();renderLight()}
  else if(d.close){closeSheet()}
});
window.addEventListener('hashchange',fromHash);

var LIVE={at:null};
function loadCounts(){try{var cb='__nfc'+Date.now(),s=document.createElement('script');
 window[cb]=function(r){try{var rows=(r&&r.table&&r.table.rows)||[];rows.forEach(function(row){var c=row.c||[];if(!c[0]||!c[4])return;var no=String(c[0].v||'').trim(),n=c[4].v;if(n===null||n===''||isNaN(+n))return;D.walks.forEach(function(w){if(w.no===no)w.signed=+n})});if(rows.length){LIVE.at=new Date();refreshW();var y=window.scrollY;render();window.scrollTo(0,y)}}catch(e){}try{delete window[cb]}catch(e){}s.remove()};
 s.onerror=function(){s.remove()};s.src='https://docs.google.com/spreadsheets/d/1yxSjeW8afjuBXH9b2a5DCCRhZ0-b_E10NUuA5QEa4u0/gviz/tq?tqx=responseHandler:'+cb+'&headers=1&t='+Date.now();document.head.appendChild(s)}catch(e){}}
loadCounts();setInterval(loadCounts,60000);
setInterval(function(){if(mode!=='live')return;var n=kmin();if(n!==T){T=n;var y=window.scrollY;render();window.scrollTo(0,y)}},15000);
fromHash();
})();
</script>
