<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBFCF6">
<meta name="color-scheme" content="light">
<title>NAMED FESTA 현장 현황판</title>
<style>
:root{--bg:#FBFCF6;--fg:#111;--sub:#3E3E3A;--mute:#6A6A64;--rule:#111;--hair:#D6D7CC;--paper:#fff;
--y:#FDD921;--yl:#FFF3B0;--g:#A0D94E;--gl:#E2F3CC;--p:#F088C2;--pl:#FCDDEE;--b:#69CDF4;--bl:#D6F0FC;
--red:#B3121B;--redl:#FBE3E4;
--f:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;--tab:64px;--gut:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5;font-weight:450;letter-spacing:-.2px;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;overflow-x:hidden;
padding:0 max(0px,env(safe-area-inset-right)) calc(var(--tab) + env(safe-area-inset-bottom) + 24px) max(0px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
h2{margin:0;font-size:20px;font-weight:800;line-height:1.3}
h3{margin:0;font-size:17px;font-weight:800}
p{margin:0}
[hidden]{display:none!important}

/* top */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--rule);padding:calc(env(safe-area-inset-top) + 10px) var(--gut) 10px;display:flex;align-items:center;gap:10px}
.top b{font-size:15px;font-weight:800;flex:1;min-width:0}
.top .tt{font-size:15px;font-weight:700}
.pill{display:inline-block;font-size:13px;font-weight:800;padding:3px 8px;border-radius:2px;background:var(--y);color:#111}

.pane{padding:0 var(--gut)}
.sec{border-top:2px solid var(--rule);padding:16px 0 20px}
.sec>h2{margin-bottom:12px}
.lead{color:var(--sub);font-size:15px}

/* now: clock */
.clock{padding:12px 0 12px}
.clock .t{font-size:60px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.clock .cd{margin-top:8px;font-size:18px;font-weight:700}
.clock .cd span{font-weight:450;color:var(--sub)}.clock .cd .c2{display:block;font-size:16px;font-weight:600;margin-top:2px}
.tbar{margin-top:12px}
.tbar details>summary{font-size:15px;font-weight:700}
.slider{padding:10px 0 2px}
.slider .row{display:flex;align-items:center;gap:10px}
.slider input{flex:1;height:48px;accent-color:#111;margin:0}
.slider .v{font-size:20px;font-weight:800;min-width:60px;text-align:right}
.slider .ticks{position:relative;height:20px;font-size:13px;color:var(--mute);font-weight:600;margin-right:70px}.slider .ticks span{position:absolute;transform:translateX(-50%)}.slider .ticks span:first-child{transform:none}.slider .ticks span:last-child{transform:translateX(-100%)}
.prev{background:var(--y);padding:10px 12px;margin-top:12px;font-size:15px;font-weight:600;border-radius:2px}
.prev b{font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border:2px solid var(--fg);background:var(--paper);border-radius:3px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.btn:active{background:var(--fg);color:var(--bg)}
.btn.sm{min-height:44px;font-size:15px;padding:0 12px}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.dark:active{background:var(--sub)}

/* board */
.map{display:grid;grid-template-columns:78px minmax(0,1fr) 78px;gap:8px;align-items:stretch}
.side{background:var(--pl);border:2px solid var(--p);border-radius:3px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.side .bh{flex-direction:column;align-items:flex-start;gap:0}
.store{font-size:13px;line-height:1.3;padding:5px 0;border-top:1px solid color-mix(in srgb,var(--p) 70%,#fff)}
.store b{display:block;font-weight:800}
.store.off{color:var(--mute)}
.store.off i{font-style:normal;font-weight:700}
.store i{font-style:normal;font-size:12px;font-weight:600;color:var(--sub)}
.spine{position:relative;display:flex;flex-direction:column;gap:12px;padding:26px 0;min-width:0}
.spine::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:14px;margin-left:-7px;background:var(--g);border-radius:0}
.spine .ns{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;background:var(--bg);padding:0 6px;line-height:20px}
.spine .ns.n{top:0}.spine .ns.s{bottom:0}
.blk{position:relative;background:var(--cl);border:2px solid var(--c);border-radius:3px;padding:8px;min-width:0}
.blk.empty{background:var(--bg);border-style:dashed;color:var(--mute)}
.blk.empty .bh b{color:var(--mute)}
.bh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px;line-height:1.25}
.bh b{font-size:16px;font-weight:800;color:var(--fg)}
.none{font-size:13px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:46px;justify-content:center;padding:4px 8px;background:var(--paper);border:1.5px solid var(--fg);border-radius:3px;cursor:pointer;flex:1 1 auto;min-width:0;max-width:100%}
.chip b{font-size:14.5px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.chip span{font-size:13px;font-weight:500;color:var(--sub);line-height:1.2}
.chip:active{background:var(--fg);color:var(--bg)}.chip:active span{color:var(--bg)}
.side .chip{flex:1 1 100%}
.sub{border-top:1.5px solid var(--c);padding-top:6px;margin-top:6px}
.sub:first-of-type{border-top:0;padding-top:0;margin-top:0}
.sub .sl{font-size:13px;font-weight:800;margin-bottom:4px}
.sub .sl span{font-weight:500;color:var(--sub)}
.sub.empty .sl{color:var(--mute)}
.sall{grid-column:1/-1}
.band{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.band .w{grid-column:1/-1}

/* list rows (walk summary, upcoming) */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.rows li:first-child{border-top:0}
.rows .tm{font-size:20px;font-weight:800;line-height:1.2}
.rows .tm small{display:block;font-size:13px;font-weight:600;color:var(--sub)}
.rows .ds{font-size:16px;line-height:1.4}
.rows .ds b{font-weight:800}
.rows .ds .mt{font-size:14px;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:13px;font-weight:800;line-height:1;padding:4px 6px 3px;border-radius:2px;background:var(--c);color:#111;white-space:nowrap;vertical-align:1px}
.empty-msg{font-size:16px;color:var(--sub);padding:4px 0}
.empty-msg b{color:var(--fg)}
.lbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:700;cursor:pointer;min-height:44px}

/* me */
.who{padding:16px 0 4px}
.who h1{margin:0;font-size:28px;font-weight:800;line-height:1.2}
.who .ti{font-size:16px;color:var(--sub);margin-top:2px}
.viewing{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bl);padding:10px 12px;margin-top:12px;border-radius:2px;font-weight:600}
.viewing span{flex:1 1 100%}
.cur{display:flex;margin-top:14px;background:var(--cl);border:2px solid var(--fg);border-radius:3px}
.cur .band2{width:12px;flex:0 0 12px;background:var(--c)}
.cur .in{padding:12px 14px 14px;flex:1;min-width:0}
.cur .k{font-size:15px;font-weight:800}
.cur .k span{font-weight:600;color:var(--sub)}
.cur .w1{font-size:24px;font-weight:800;line-height:1.3;margin:6px 0 6px}
.cur .pl{font-size:17px;font-weight:700}
.cur .nt{font-size:15px;color:var(--sub);margin-top:6px}
.cur+.cur{margin-top:8px}
.nxt{display:flex;margin-top:10px;border:2px solid var(--fg);border-radius:3px;background:var(--paper)}
.nxt .band2{width:12px;flex:0 0 12px;background:var(--c)}
.nxt .in{padding:10px 14px 12px;flex:1;min-width:0}
.nxt .k{font-size:15px;font-weight:800}
.nxt .k span{color:var(--sub);font-weight:600}
.nxt .w1{font-size:19px;font-weight:800;line-height:1.35;margin-top:4px}
.nxt .pl{font-size:15px;font-weight:600;margin-top:2px}
.info{margin:16px 0 0;display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px 12px;font-size:16px}
.info dt{font-weight:800}
.info dd{margin:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:12px 0 12px;border-top:1px solid var(--hair);position:relative}
.tl li:first-child{border-top:0}
.tl .tm{font-size:18px;font-weight:800;line-height:1.2}
.tl .tm small{display:block;font-size:14px;font-weight:600;color:var(--sub)}
.tl .ds{border-left:6px solid var(--c);padding-left:10px;min-width:0}
.tl .ds .w1{font-size:16px;font-weight:600;line-height:1.45;margin-top:4px}
.tl .ds .nt{font-size:14px;color:var(--sub);margin-top:4px}
.tl li.past{opacity:.42}
.tl li.on .ds{background:var(--cl);padding:6px 10px 8px}
.tl li.on .tm{color:var(--fg)}
.tl li.ov .ds{border-left-color:var(--red)}
.ovm{display:block;margin-top:6px;font-size:14px;font-weight:800;color:var(--red)}
.ovm.team{color:var(--sub);font-weight:700}
.tl li.nowl{display:flex;align-items:center;gap:8px;padding:2px 0;border-top:0;font-size:14px;font-weight:800}
.tl li.nowl::after{content:"";flex:1;height:3px;background:var(--fg)}
.tl li.nowl+li{border-top:0}
.picker h1{margin:0;font-size:28px;font-weight:800;padding:16px 0 4px}
.picker .lead{margin-bottom:8px}
.grp{border-top:2px solid var(--rule);padding:12px 0 16px}
.grp h2{font-size:17px;margin-bottom:10px}
.gbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gbtns button{min-height:56px;border:2px solid var(--fg);background:var(--paper);border-radius:3px;font-weight:800;font-size:16px;cursor:pointer;padding:6px;line-height:1.2}
.gbtns button small{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-top:2px}
.gbtns button:active,.gbtns button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.gbtns button:active small{color:var(--bg)}

/* details */
details{border-top:1px solid var(--hair)}
details>summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:6px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;font-size:24px;font-weight:500;line-height:1;width:24px;text-align:center}
details[open]>summary::after{content:"\2212"}
details>summary .sm{font-weight:600;font-size:14px;color:var(--sub)}
details .body{padding:0 0 14px}
.acc{border-top:2px solid var(--rule)}
.acc details:first-child{border-top:0}
ul.dots{margin:0;padding:0 0 0 18px}
ul.dots li{margin:4px 0}
ol.steps{margin:0;padding:0;list-style:none}
ol.steps li{padding:8px 0;border-top:1px solid var(--hair)}
ol.steps li:first-child{border-top:0}
ol.steps b{display:block;font-weight:800;font-size:17px}

/* walk */
.gantt{position:relative;margin-top:4px;padding-bottom:24px}
.gantt .axis{position:relative;height:20px;margin-left:44px;font-size:13px;color:var(--sub);font-weight:600}
.gantt .axis span{position:absolute;transform:translateX(-50%)}
.gantt .axis span:first-child{transform:none}
.gantt .axis span:last-child{transform:translateX(-100%)}
.grow{display:flex;align-items:center;height:30px;width:100%;background:none;border:0;padding:0;cursor:pointer}
.grow .gl{width:44px;flex:0 0 44px;font-size:14px;font-weight:800;text-align:left}
.grow .gl.over{color:var(--red)}
.grow .gt{position:relative;flex:1;height:100%;border-left:1px solid var(--hair);background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/7 - 1px),var(--hair) calc(100%/7 - 1px),var(--hair) calc(100%/7))}
.grow .bar{position:absolute;top:6px;height:18px;display:flex;border:1.5px solid #111;border-radius:2px;overflow:hidden}
.grow .bar i{display:block;height:100%}
.grow.done .bar{opacity:.35}
.gnow{position:absolute;top:20px;bottom:22px;width:3px;background:#111;margin-left:-1px;pointer-events:none}
.gnow b{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;background:var(--bg);padding:0 3px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--sub);margin-top:10px;font-weight:600}
.legend i{display:inline-block;width:18px;height:12px;border:1.5px solid #111;vertical-align:-1px;margin-right:5px}
.wk{border-top:2px solid var(--rule);padding:14px 0 6px;scroll-margin-top:70px}
.wk.done{opacity:.5}
.wk .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk .no{font-size:22px;font-weight:800}
.wk h3{font-size:18px;font-weight:800;line-height:1.35;margin:4px 0 10px}
.st{font-size:13px;font-weight:800;padding:4px 7px 3px;border-radius:2px;border:1.5px solid #111;line-height:1}
.st.go{background:#111;color:var(--bg)}
.st.gat{background:var(--y)}
.st.done{border-color:var(--mute);color:var(--sub)}
.wk .left{font-size:15px;font-weight:700}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 12px;font-size:16px;margin:0 0 6px}
.kv dt{font-weight:800}
.kv dd{margin:0}
.kv .big{font-size:20px;font-weight:800}
.over{color:var(--red);font-weight:800}
.wk details>summary{font-size:16px}

/* sos */
.sos{background:var(--red);color:#fff;margin:14px calc(-1*var(--gut)) 0;padding:16px var(--gut) 18px}
.sos h2{font-size:22px}
.sos .lead{color:#fff;opacity:.92;margin-top:4px}
.addr{display:block;width:100%;text-align:left;background:#fff;color:#111;border:0;border-radius:3px;padding:10px 12px;margin-top:10px;cursor:pointer;min-height:56px}
.addr small{display:block;font-size:14px;font-weight:800;color:var(--red)}
.addr span{display:block;font-size:17px;font-weight:700;line-height:1.4}
.addr em{display:block;font-style:normal;font-size:13px;color:var(--sub);margin-top:2px;font-weight:600}
.addr:active{background:var(--redl)}
.call{display:flex;gap:8px;margin-top:12px}
.call a{flex:1;display:flex;align-items:center;justify-content:center;min-height:60px;background:#fff;color:var(--red);font-size:24px;font-weight:800;text-decoration:none;border-radius:3px}
.call a.s{flex:0 0 96px;font-size:20px;background:transparent;color:#fff;border:2px solid #fff}
.call a:active{background:var(--redl)}
.er{margin-top:12px;font-size:16px;font-weight:600}
.er b{font-weight:800}
.er a{color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:8px 8px 8px 0;border-top:1px solid var(--hair)}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.tbl th{font-weight:800;white-space:nowrap}
.copy{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--fg);border-radius:3px;padding:10px 12px;margin-top:8px;cursor:pointer;min-height:52px}
.copy b{display:block;font-weight:800;font-size:15px}
.copy span{display:block;font-size:16px;line-height:1.45}
.copy small{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-top:4px}
.copy:active{background:var(--yl)}
.case .row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 10px;font-size:16px}
.case .row dt{font-weight:800}
.case .row dd{margin:0}
.who2{font-size:13px;font-weight:800;padding:3px 6px;border:1.5px solid #111;border-radius:2px}
.flag-h{color:var(--red);font-weight:800}

/* map */
.km{display:block;margin-top:4px;border:2px solid var(--fg);border-radius:3px;overflow:hidden;background:#fff}
.km img{display:block;width:100%;height:auto}
.kmc{font-size:14px;color:var(--sub);margin-top:6px;font-weight:600}
.pl-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.pl-row:first-child{border-top:0}
.pl-row .nm{font-weight:800}
.pl-row .dsc{font-size:15px;color:var(--sub)}
.zone-h{font-size:15px;font-weight:800;margin:14px 0 2px;padding-top:10px;border-top:2px solid var(--fg)}
.zone-h:first-child{margin-top:0}
.sp{padding:10px 0;border-top:1px solid var(--hair)}
.sp .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sp .l1 b{font-size:17px;font-weight:800}
.sp .hr{font-size:15px;font-weight:700}
.sp .hr.off{color:var(--mute)}
.sp .o{font-size:15px;margin-top:2px}
.sp .m{font-size:15px;color:var(--sub);margin-top:2px}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:2px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tabs button{height:var(--tab);border:0;background:none;font-size:15px;font-weight:700;cursor:pointer;padding:0 2px;line-height:1.2;position:relative}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg);font-weight:800}
.tabs .sq{display:inline-block;width:8px;height:8px;background:var(--red);margin-right:4px;vertical-align:1px}
.tabs button[aria-selected=true] .sq{background:#FF8A90}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:3px;font-weight:700;z-index:40;font-size:16px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (min-width:640px){.pane,.top{max-width:640px;margin-inline:auto}.sos{margin-inline:calc(-1*var(--gut))}}
.rbtn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 16px;background:#111;color:#fff;font-weight:800;font-size:17px;text-decoration:none;border-radius:3px}.rbtn:focus-visible,.rlink:focus-visible{outline:3px solid #69CDF4;outline-offset:2px}.rlink{display:inline-flex;align-items:center;min-height:44px;font-weight:700;color:#111;text-decoration:underline;text-underline-offset:3px}</style>
</head>
<body>
<header class="top"><b>NAMED FESTA 현장</b><span id="mode"></span><span class="tt tn" id="topt"></span></header>
<main>
<section class="pane" id="v-now" role="tabpanel"></section>
<section class="pane" id="v-me" role="tabpanel" hidden></section>
<section class="pane" id="v-walk" role="tabpanel" hidden></section>
<section class="pane" id="v-sos" role="tabpanel" hidden></section>
<section class="pane" id="v-map" role="tabpanel" hidden></section>
</main>
<nav class="tabs" role="tablist" aria-label="화면">
<button role="tab" data-v="now" aria-selected="true">지금</button>
<button role="tab" data-v="me" aria-selected="false">내 일정</button>
<button role="tab" data-v="walk" aria-selected="false">산책</button>
<button role="tab" data-v="sos" aria-selected="false">긴급·소통</button>
<button role="tab" data-v="map" aria-selected="false">지도</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="application/json" id="data">{
 "day": "10/24(토)",
 "ver": "v1.1 · 10/22(목) 23:00 기준",
 "sunset": "17:43",
 "places": {
  "D-B1": {
   "zone": "돗가비마을",
   "name": "지하 1층",
   "desc": "본부 · 짐 보관 · 구급함 · 셀러 이름표 · 무전기",
   "light": "#FFF3B0",
   "strong": "#FDD921"
  },

<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
var P=D.places,PEOPLE=D.people,BY={};PEOPLE.forEach(function(p){BY[p.id]=p});
var $=function(id){return document.getElementById(id)};
function m(s){if(!s)return null;var a=String(s).split(':');return (+a[0])*60+(+a[1])}
function hm(n){n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function dur(n){n=Math.max(0,Math.round(n));var h=Math.floor(n/60),mm=n%60;return h?(h+'시간'+(mm?' '+mm+'분':'')):mm+'분'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pc(c){return P[c]||P['기타']}
function cv(c){var x=pc(c);return '--c:'+x.strong+';--cl:'+x.light}
function tag(c){return '<span class="tag" style="'+cv(c)+'">'+esc(c)+'</span>'}
function pname(c){var x=pc(c);return x.name===c?'':x.name}
function where(c){var n=pname(c);return tag(c)+(n?' '+esc(n):'')}
function isOrg(p){return p.team===p.name}

/* ---------- time ---------- */
var dm=/(\d+)\/(\d+)/.exec(D.day),MON=+dm[1],DAY=+dm[2],YEAR=2026;
var OPEN=720,END=1140,SUN=m(D.sunset);
function kst(){var n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+540)*60000)}
function kmin(){var k=kst();return k.getHours()*60+k.getMinutes()}
var k0=kst(),isDay=k0.getFullYear()===YEAR&&k0.getMonth()+1===MON&&k0.getDate()===DAY;
var tq=new URLSearchParams(location.search).get('t'),mode,T;
if(tq&&/^\d{1,2}:\d{2}$/.test(tq)){mode='fixed';T=m(tq)}else if(isDay){mode='live';T=kmin()}else{mode='preview';T=720}

function active(p,t){return p.tasks.filter(function(x){var s=m(x.s),e=m(x.e);if(s==null)return false;if(s===e)return t>=s&&t<s+10;return s<=t&&t<e})}
function nextT(p,t){return p.tasks.filter(function(x){return x.s&&m(x.s)>t}).sort(function(a,b){return m(a.s)-m(b.s)})[0]}
function sorted(ts){return ts.slice().sort(function(a,b){return (a.s?m(a.s):9999)-(b.s?m(b.s):9999)})}

/* ---------- storage ---------- */
function getMe(){try{return localStorage.getItem('nf_me')||''}catch(e){return ''}}
function setMe(v){try{v?localStorage.setItem('nf_me',v):localStorage.removeItem('nf_me')}catch(e){}}

/* ---------- copy ---------- */
var tt;
function toast(s){var el=$('toast');el.textContent=s;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},1600)}
function copy(txt){
  function fb(){var a=document.createElement('textarea');a.value=txt;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a);toast('복사했어요')}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){toast('복사했어요')},fb);setTimeout(function(){if($('toast').hidden)fb()},400)}else fb();
}

}

/* ---------- NOW ---------- */
function countdown(t){
  if(t<OPEN)return '오픈 12:00까지 <b class="tn">'+dur(OPEN-t)+'</b>';
  if(t<SUN)return '일몰 '+D.sunset+'까지 <b class="tn">'+dur(SUN-t)+'</b><span class="c2">종료 19:00까지 '+dur(END-t)+'</span>';
  if(t<END)return '종료 19:00까지 <b class="tn">'+dur(END-t)+'</b><span class="c2">일몰 '+D.sunset+' 지남 · 조명 확인</span>';
  if(t<1320)return '행사 종료 <span>· 철거·마감 중</span>';
  return '오늘 일정 끝';
}
function occ(t){var o={};PEOPLE.forEach(function(p){active(p,t).forEach(function(x){(o[x.place]=o[x.place]||[]).push({p:p,x:x})})});return o}
function chip(a){return '<button class="chip" data-p="'+a.p.id+'"><b>'+esc(a.p.name)+'</b><span>'+esc(a.x.short||a.x.what)+'</span></button>'}

function storeOpen(s,t){var h=/(\d+:\d+)\s*~\s*(\d+:\d+)/.exec(s.hours);if(!h)return null;return t>=m(h[1])&&t<m(h[2])}

  var l=o[code]||[],x=pc(code);
  var st=D.spots.filter(function(s){return s.place===code}).map(function(s){var op=storeOpen(s,t);return '<div class="store'+(op===false?' off':'')+'"><b>'+esc(s.no)+'</b>'+esc(s.name)+(op===false?' <i>닫힘</i>':'')+'</div>'}).join('');
  return '<div class="side" style="'+cv(code)+'"><div class="bh"><b>'+esc(code)+'</b>'+esc(x.name)+'</div>'+(l.length?'<div class="chips">'+l.map(chip).join('')+'</div>':'')+st+'</div>';
}
function dblock(o){
  var subs=['D-B1','D-1F','D-3F'],any=false,h='';
  subs.forEach(function(c){var l=o[c]||[];if(l.length)any=true;h+='<div class="sub'+(l.length?'':' empty')+'"><div class="sl">'+esc(c.replace('D-',''))+' <span>'+esc((pc(c).desc||'').split('·')[0].trim())+'</span></div>'+(l.length?'<div class="chips">'+l.map(chip).join('')+'</div>':'<p class="none">배정 없음</p>')+'</div>'});
  if((o.D||[]).length){any=true;h+='<div class="sub"><div class="sl">건물 전체</div><div class="chips">'+o.D.map(chip).join('')+'</div></div>'}
  return '<div class="blk'+(any?'':' empty')+'" style="'+cv('D')+'"><div class="bh"><b>D</b>돗가비마을</div>'+h+'</div>';
}
var W=D.walks.map(function(w){return Object.assign({},w,{g:m(w.gather),d:m(w.dep),e:m(w.end)})}).sort(function(a,b){return a.d-b.d||a.g-b.g});
function wst(w,t){return t>=w.e?'done':t>=w.d?'go':t>=w.g?'gat':'pre'}
var WSL={pre:'예정',gat:'집결 중',go:'진행 중',done:'종료'};
function renderNow(){
  var t=T,o=occ(t),el=$('v-now');
  if(!$('sl')){
    var s0='<div class="clock"><div class="t tn" id="clk"></div><div class="cd" id="cdn"></div><div id="prv"></div>';
    s0+='<div class="tbar"><details data-k="slider"'+(mode==='preview'?' open':'')+'><summary>다른 시각 보기 <span class="sm">05:00~22:00</span></summary><div class="slider"><div class="row"><input type="range" id="sl" min="300" max="1320" step="10" aria-label="보는 시각"><span class="v tn" id="slv"></span></div><div class="ticks tn"><span style="left:0">05</span><span style="left:23.5%">09</span><span style="left:41.2%">12</span><span style="left:58.8%">15</span><span style="left:82.4%">19</span><span style="left:100%">22</span></div><p style="margin-top:8px" id="glw" hidden><button class="btn sm dark" id="golive">지금 시각으로</button></p></div></details></div></div><div id="nowb"></div>';
    el.innerHTML=s0;
    var sl=$('sl');

  var h='';
  h+='<div class="sec"><h2>누가 어디에</h2><p class="lead" style="margin-bottom:12px">숲길 북쪽이 위. 이름을 누르면 그 사람 일정이 열려요.</p>';

  // walks
  var go=W.filter(function(w){return wst(w,t)==='go'}),gat=W.filter(function(w){return wst(w,t)==='gat'}),pre=W.filter(function(w){return wst(w,t)==='pre'}).sort(function(a,b){return a.g-b.g});

  if(!go.length&&!nx.length)h+='<p class="empty-msg">오늘 산책은 모두 끝났어요. 전체 기록은 <button class="lbtn" data-go="walk">산책 탭</button>에서 보세요.</p>';
  h+='</div>';

  // upcoming
  var g={},ord=[];
  PEOPLE.forEach(function(p){p.tasks.forEach(function(x){var s=m(x.s);if(s==null||s<=t||s>t+30)return;var key=x.s+'|'+x.place+'|'+(x.short||x.what);if(!g[key]){g[key]={s:s,x:x,ps:[]};ord.push(key)}g[key].ps.push(p)})});

  groups().forEach(function(g){if(!g[1].length)return;h+='<div class="grp"><h2>'+g[0]+'</h2><div class="gbtns">'+g[1].map(function(p){var sub=p.team===p.name?'':/슈퍼바이저/.test(p.title)?'':p.team==='피플포유'?p.title.split('·').pop().trim():p.title.split('·')[0].trim();return '<button data-pick="'+p.id+'"'+(p.id===me?' aria-pressed="true"':'')+'>'+esc(p.name)+(sub?'<small>'+esc(sub)+'</small>':'')+'</button>'}).join('')+'</div></div>'});

var R={now:renderNow,me:renderMe,walk:renderWalk,sos:renderSos,map:renderMap},sosDone=false;
function render(light){
  renderTop();
  if(view==='sos'){if(!sosDone){renderSos();sosDone=true}}
  else R[view]();
}
function show(v,noHash){
  view=v;
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v?'true':'false')});
  Object.keys(R).forEach(function(k){$('v-'+k).hidden=k!==v});
  render();window.scrollTo(0,0);
  if(!noHash){var hs=v==='now'?'':v==='me'&&meView&&meView!==getMe()?'#p='+meView:'#'+v;try{history.replaceState(null,'',location.pathname+location.search+hs)}catch(e){}}
}
function fromHash(){
  var h=location.hash.replace('#','');
  var pm=/^p=([A-Za-z0-9]+)/.exec(h);
  if(pm&&BY[pm[1]]){meView=pm[1];pickOther=false;show('me',true);return}
  if(R[h])show(h,true);else show('now',true);
}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(!b)return;if(b.dataset.v==='me'&&view!=='me'){meView='';pickOther=false}show(b.dataset.v)});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-p],[data-pick],[data-setme],[data-back],[data-other],[data-reset],[data-copy],[data-w],[data-go]');if(!b)return;
  var d=b.dataset;
  if(d.p){meView=d.p;pickOther=false;show('me')}
  else if(d.pick){if(pickOther&&getMe()){meView=d.pick}else{setMe(d.pick);meView=''}pickOther=false;show('me')}
  else if(d.setme){setMe(d.setme);meView='';show('me')}
  else if(d.back){meView='';pickOther=false;show('me')}
  else if(d.other){pickOther=true;render();window.scrollTo(0,0)}
  else if(d.reset){setMe('');meView='';pickOther=false;render();window.scrollTo(0,0)}
  else if(d.copy){copy(d.copy)}
  else if(d.w){var t=$('w-'+d.w);if(t)t.scrollIntoView({block:'start'})}
  else if(d.go){show(d.go)}
});
window.addEventListener('hashchange',fromHash);

var LIVE={at:null};
function loadCounts(){try{var cb='__nfc'+Date.now(),s=document.createElement('script');
 window[cb]=function(r){try{var rows=(r&&r.table&&r.table.rows)||[];rows.forEach(function(row){var c=row.c||[];if(!c[0]||!c[4])return;var no=String(c[0].v||'').trim(),n=c[4].v;if(n===null||n===''||isNaN(+n))return;D.walks.forEach(function(w){if(w.no===no)w.signed=+n})});if(rows.length){LIVE.at=new Date();var y=window.scrollY;render();window.scrollTo(0,y)}}catch(e){}try{delete window[cb]}catch(e){}s.remove()};
 s.onerror=function(){s.remove()};s.src='https://docs.google.com/spreadsheets/d/1yxSjeW8afjuBXH9b2a5DCCRhZ0-b_E10NUuA5QEa4u0/gviz/tq?tqx=responseHandler:'+cb+'&headers=1&t='+Date.now();document.head.appendChild(s)}catch(e){}}
loadCounts();setInterval(loadCounts,60000);
setInterval(function(){if(mode!=='live')return;var n=kmin();if(n!==T){T=n;var y=window.scrollY;render();window.scrollTo(0,y)}},15000);
fromHash();
})();
