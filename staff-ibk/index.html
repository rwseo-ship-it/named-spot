<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PRESS CLUB SEONAM 현장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#F7F6F2;--card:#fff;--ink:#171717;--sub:#6B6B6B;--line:#E4E2DB;
--gj:#2E8C61;--gjl:#E3F2E9;--bj:#6B54B8;--bjl:#ECE8F8;--cm:#7A7A7A;--cml:#EEEEEC;
--warn:#8A6A00;--warnl:#FFF2C7;--red:#D33A31}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline}
.brand b{font-size:17px;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--sub)}
.days{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:46px;padding:6px 0;border-radius:12px;text-align:center;background:var(--card);border:1px solid var(--line)}
.day i{display:block;font-style:normal;font-size:11px;color:var(--sub)}
.day b{display:block;font-size:16px}
.day.gj{border-bottom:3px solid var(--gj)}.day.bj{border-bottom:3px solid var(--bj)}
.day[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.day[aria-pressed=true] i{color:#cfcfcf}
.day.today b::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--red);margin:2px auto 0}
main{padding:14px 16px 96px;max-width:560px;margin:0 auto}
h2{font-size:22px;letter-spacing:-.4px;margin:4px 0 2px}
.lead{color:var(--sub);font-size:14px;margin-bottom:14px}
h3{font-size:15px;margin:22px 0 8px}
.seg{display:flex;background:var(--cml);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:14px;color:var(--sub)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.now{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.now small{color:#bdbdbd;font-size:12px}
.now p{font-size:17px;font-weight:600;margin-top:2px}
.now .nx{color:#d9d9d9;font-size:14px;margin-top:6px;font-weight:400}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.it{border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it summary{list-style:none;display:grid;grid-template-columns:62px 1fr;gap:10px;padding:12px 14px;cursor:pointer}
.it summary::-webkit-details-marker{display:none}
.tm{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35;word-break:keep-all}
.tm.soft{color:var(--sub);font-weight:500;font-size:13px}
.wt{font-size:15px;font-weight:500;word-break:keep-all}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:13px;color:var(--sub)}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px}
.t-광주{background:var(--gjl);color:var(--gj)}.t-본점{background:var(--bjl);color:var(--bj)}.t-공통{background:var(--cml);color:var(--cm)}
.st{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--warnl);color:var(--warn)}
.st.an{background:#E7EEFB;color:#3559A8}
.it.cur{background:#FFFBEA}
.it.cur .tm{color:var(--red)}
.it.done .wt,.it.done .tm{color:#ABABAB}
.dt{padding:0 14px 12px 86px;font-size:14px;color:#333}
.dt div{display:flex;gap:8px;padding:3px 0}
.dt span{flex:0 0 44px;color:var(--sub)}
.empty{padding:28px 16px;text-align:center;color:var(--sub);font-size:14px}
.names h4{font-size:13px;color:var(--sub);font-weight:600;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}

.me{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.me b{font-size:19px}.me i{display:block;font-style:normal;font-size:13px;color:var(--sub)}
.link{font-size:13px;color:var(--sub);text-decoration:underline}
.spot{border-radius:16px;padding:14px 16px;margin-top:10px;font-size:16px;font-weight:600;word-break:keep-all}
.spot small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-bottom:2px}
.spot.gj{background:var(--gjl);color:#1E5E41}.spot.bj{background:var(--bjl);color:#463585}.spot.no{background:var(--cml);color:var(--sub)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:16px}
.row{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}
.row b{font-variant-numeric:tabular-nums;font-size:14px}
.sos{background:var(--red);color:#fff;border-radius:18px;padding:16px}
.sos p{font-size:13px;opacity:.9;margin-bottom:10px}
.calls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.calls a{background:#fff;color:var(--red);border-radius:12px;padding:12px 4px;text-align:center;font-weight:700;font-size:18px;text-decoration:none;line-height:1.2}
.calls a small{display:block;font-size:11px;font-weight:600}
.steps li{list-style:none;display:grid;grid-template-columns:28px 1fr;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps b{font-size:15px}
.steps p{font-size:14px;color:#333}
.case{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
.case summary{list-style:none;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between}
.case summary::-webkit-details-marker{display:none}
.case summary::after{content:"+";color:var(--sub)}
.case[open] summary::after{content:"–"}
.case div{padding:0 14px 12px;font-size:14px;color:#333}
.case div p{padding:2px 0}
.case em{font-style:normal;color:var(--sub)}
.wx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wx div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
.wx b{display:block;font-size:13px;margin-bottom:2px}
.wx .stop{background:#FDE7E5;border-color:#F6C6C2;color:#9B241D}
.pp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pp b{font-size:15px}.pp i{display:block;font-style:normal;font-size:13px;color:var(--sub)}
.btn{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;text-decoration:none;background:#fff}
.btn.call{background:var(--ink);color:#fff;border-color:var(--ink)}
.btns{display:flex;gap:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.chain{display:flex;flex-direction:column;gap:4px}
.chain span{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.chain i{font-style:normal;color:var(--sub);text-align:center;font-size:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:12px 0 14px;font-size:14px;color:var(--sub);font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--ink)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:9px 14px;border-radius:10px}
.foot{margin-top:28px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>

<script>

  h+='<div class="spot '+cls+'"><small>'+dayLabel(S.d)+' 내 자리</small>'+esc(where&&where!=='없음'?where:'이날은 일정 없음')+'</div>';
  if(S.d===20&&P.g){
    h+='<h3>11/20 시간대별 위치 · '+esc(D.grid.head[P.g])+'</h3><div class="rows">'+D.grid.rows.map(function(r){return '<div class="row"><b>'+esc(r[0])+'</b><span>'+esc(r[P.g])+'</span></div>'}).join('')+'</div>';
  }
  var mine=D.cue.filter(function(x){return x.d===S.d&&((x.a+' '+x.b+' '+x.v).indexOf(P.short)>=0)});
  h+='<h3>이날 내가 맡은 일 '+mine.length+'</h3>'+(mine.length?'<div class="list">'+mine.map(item).join('')+'</div>':'<div class="list"><div class="empty">큐시트에 이름이 걸린 일은 없어요</div></div>');
  return h;
}

function viewSos(){
  var h='<div class="sos"><h2>사고 나면 119 먼저</h2><p>그다음 무전, 그리고 락원에게. 치료비 같은 약속은 하지 않아요.</p><div class="calls"><a href="tel:119">119<small>화재·구급</small></a><a href="tel:112">112<small>경찰</small></a><a href="tel:0622205555">전남대병원<small>응급실 24시간</small></a></div></div>';
  h+='<h3>상황별로 이렇게</h3>'+D.cases.map(function(c){return '<details class="case"><summary>'+esc(c[0])+'</summary><div><p>1. '+esc(c[1])+'</p><p>2. '+esc(soft(c[2]))+'</p><p><em>담당 '+esc(c[3])+'</em></p></div></details>'}).join('');
  h+='<h3>날씨 판단 · 정하는 사람 서락원</h3><div class="rows">'+D.decide.map(function(r){return '<div class="row" style="grid-template-columns:120px 1fr"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>'}).join('')+'</div>';
  h+='<h3>OPEN HOUSE 취소 기준</h3><div class="wx">'+D.weather.slice(0,3).map(function(w){return '<div class="stop"><b>'+esc(w[0])+'</b>'+esc(w[2])+'</div>'}).join('')+'</div>';
  h+='<p class="lead" style="margin-top:8px">그 아래(비 1~4mm, 바람 6~9m/s, 체감 1~5℃)는 대비하며 진행해요. 전시 A·B는 실내라 날씨와 관계없이 열어요. 준공식은 IBK가 정해요.</p>';
  return h;
}

function viewInfo(){
  var h='<h2>연락·장소</h2><p class="lead">IBK 연락은 락원만 해요</p>';
  h+='<h3>지휘 순서 · 보고는 아래에서 한 칸씩 위로</h3><div class="chain">'+D.chain.map(function(c,i){return (i?'<i>↓</i>':'')+'<span>'+esc(c)+'</span>'}).join('')+'</div>';
  h+='<h3>보고 한 줄</h3><div class="box">'+esc(D.report)+'<br><span style="color:var(--sub)">예) '+esc(D.reportEx)+'</span></div>';
  h+='<h3>연락망</h3>'+D.contacts.map(function(c){return '<div class="pp"><div><b>'+esc(c.name)+'</b><i>'+esc(c.role)+'</i></div>'+(c.tel?'<a class="btn call" href="tel:'+c.tel.replace(/[^0-9]/g,'')+'">전화</a>':'<span class="st">번호 확인 중</span>')+'</div>'}).join('');
  h+='<h3>장소</h3>'+D.places.map(function(p){return '<div class="pp"><div><span class="tag t-'+p.site+'">'+p.site+'</span> <b>'+esc(p.name)+'</b><i>'+esc(p.addr)+'</i><i>'+esc(p.memo)+'</i></div><div class="btns"><button class="btn" data-copy="'+esc(p.addr)+'">복사</button><a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/'+encodeURIComponent(p.addr)+'">지도</a></div></div>'}).join('');
  h+='<p class="foot">'+esc(D.ver)+' · 바뀐 내용은 카톡 공지가 우선이에요</p>';
  return h;
}

function render(){
  renderDays();
  $('days').style.display=(S.view==='day'||S.view==='me')?'':'none';
  var f={day:viewDay,me:viewMe,sos:viewSos,info:viewInfo}[S.view];
  $('main').innerHTML=f();
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===S.view)});
}
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.d){S.d=+t.dataset.d;render();window.scrollTo(0,0)}
  else if(t.dataset.v){S.view=t.dataset.v;render();window.scrollTo(0,0)}
  else if(t.dataset.s){S.site=t.dataset.s;store('site',S.site);render()}
  else if(t.dataset.me){S.me=t.dataset.me;store('me',S.me);render()}
  else if(t.id==='reset'){S.me=null;store('me',null);render()}
  else if(t.dataset.copy){copy(t.dataset.copy)}
});
render();
})();
</script>
</body>
</html>
